<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Innovative Ecopure Technologies</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2ef;
      color: #1d2d3d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 150px;
      max-width: 60%;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      color: #1d2d3d;
    }

    .subtitle {
      margin: 12px 0 8px;
      font-size: 17px;
      color: #53636b;
    }

    .services {
      margin: 0 0 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #3e7465;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: #1d2d3d;
      color: #ffffff;
    }

    .secondary {
      background: #dce9e3;
      color: #1d2d3d;
    }

    .outline {
      background: #ffffff;
      color: #1d2d3d;
      border: 1px solid #d4dcda;
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #7a8588;
    }

    /* Contact form */

    .contact-section {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    .contact-section.active {
      display: block;
    }

    .contact-section h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1d2d3d;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #34464f;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #d4dcda;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3e7465;
    }

    .submit-button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #1d2d3d;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      background: transparent;
      color: #53636b;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div id="mainContent">

      <img
        src="iEcopure_logo.png"
        alt="Innovative Ecopure Technologies"
        class="logo"
      >

      <h1>Innovative Ecopure Technologies Private Limited</h1>

      <p class="subtitle">
        Water &amp; Wastewater Treatment Solutions
      </p>

      <p class="services">
        WTP • STP • ETP • CETP • ZLD
      </p>

      <div class="buttons">

        <button
          class="button primary"
          onclick="showContactForm()"
        >
          Contact Us
        </button>

        <a
          class="button secondary"
          href="brochures.html"
        >
          Brochures
        </a>

        <a
          class="button outline"
          href="https://i-ecopure.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Website
        </a>

        <a
          class="button outline"
          href="https://www.linkedin.com/company/innovative-ecopure-technologies-p-limited/"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>

      </div>

      <div class="footer">
        Tiruppur, Tamil Nadu, India
      </div>

    </div>


    <!-- CONTACT FORM -->

    <div
      id="contactSection"
      class="contact-section"
    >

      <h2>Contact Us</h2>

      <form
        action="https://formsubmit.co/info@i-ecopure.com"
        method="POST"
      >

        <input
          type="hidden"
          name="_subject"
          value="New Contact Enquiry - Innovative Ecopure"
        >

        <input
          type="hidden"
          name="_template"
          value="table"
        >

        <label for="name">
          Name
        </label>

        <input
          type="text"
          id="name"
          name="Name"
          required
        >


        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          required
        >


        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          name="Phone Number"
          required
        >


        <label for="country">
          Country
        </label>

        <input
          type="text"
          id="country"
          name="Country"
          required
        >


        <label for="company">
          Company Name
        </label>

        <input
          type="text"
          id="company"
          name="Company Name"
          required
        >


        <label for="designation">
          Designation
        </label>

        <input
          type="text"
          id="designation"
          name="Designation"
          required
        >


        <label for="message">
          Requirement / Message
        </label>

        <textarea
          id="message"
          name="Requirement / Message"
          required
        ></textarea>


        <button
          type="submit"
          class="submit-button"
        >
          Submit Enquiry
        </button>

      </form>

      <button
        class="back-button"
        onclick="hideContactForm()"
      >
        ← Back
      </button>

    </div>

  </div>


  <script>

    function showContactForm() {
      document.getElementById("mainContent").style.display = "none";
      document.getElementById("contactSection").classList.add("active");
      window.scrollTo(0, 0);
    }

    function hideContactForm() {
      document.getElementById("contactSection").classList.remove("active");
      document.getElementById("mainContent").style.display = "block";
      window.scrollTo(0, 0);
    }

  </script>

</body>
</html>
