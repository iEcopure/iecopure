<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brochures | Innovative Ecopure Technologies</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2ef;
      color: #1d2d3d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 130px;
      max-width: 55%;
      margin-bottom: 24px;
    }

    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #dce9e3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #3e7465;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.3;
      color: #1d2d3d;
    }

    .message {
      margin: 12px 0 28px;
      color: #667477;
      font-size: 15px;
      line-height: 1.5;
    }

    .brochure {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 15px 20px;
      border-radius: 12px;
      background: #1d2d3d;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    .brochure:hover {
      opacity: 0.92;
    }

    .back {
      display: block;
      margin-top: 22px;
      color: #53636b;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="iEcopure_logo.png"
      alt="Innovative Ecopure Technologies"
      class="logo"
    >

    <div class="check">
      ✓
    </div>

    <h1>
      Thank you!
    </h1>

    <p class="message">
      Your details have been received.<br>
      You can now download our brochures.
    </p>

    <a
      class="brochure"
      href="iEcopure_1.pdf"
      target="_blank"
      rel="noopener noreferrer"
      download
    >
      Download Brochure 1
    </a>

    <a
      class="brochure"
      href="iEcopure_2.pdf"
      target="_blank"
      rel="noopener noreferrer"
      download
    >
      Download Brochure 2
    </a>

    <a
      class="back"
      href="index.html"
    >
      ← Back to Home
    </a>

  </div>

</body>
</html>
