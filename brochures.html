<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brochures | Innovative Ecopure Technologies</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2ef;
      color: #1d2d3d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      display: block;
      width: 130px;
      max-width: 55%;
      margin: 0 auto 22px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      color: #1d2d3d;
    }

    .intro {
      margin: 12px 0 28px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      color: #667477;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #34464f;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #d4dcda;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #3e7465;
    }

    .submit-button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #1d2d3d;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      text-decoration: none;
      color: #53636b;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="iEcopure_logo.png"
      alt="Innovative Ecopure Technologies"
      class="logo"
    >

    <h1>Download Our Brochures</h1>

    <p class="intro">
      Please enter your details to access our company brochures.
    </p>

    <form
      action="https://formsubmit.co/info@i-ecopure.com"
      method="POST"
    >

      <input
        type="hidden"
        name="_subject"
        value="New Brochure Download - Innovative Ecopure"
      >

      <input
        type="hidden"
        name="_template"
        value="table"
      >

      <input
        type="hidden"
        name="_next"
        value="https://iecopure.github.io/iecopure/brochures-thankyou.html"
      >

      <label for="name">
        Name
      </label>

      <input
        type="text"
        id="name"
        name="Name"
        required
      >

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        name="email"
        required
      >

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        name="Phone Number"
        required
      >

      <button
        type="submit"
        class="submit-button"
      >
        Continue to Brochures
      </button>

    </form>

    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Home
    </a>

  </div>

</body>
</html>
