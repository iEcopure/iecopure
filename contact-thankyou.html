<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Innovative Ecopure Technologies</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2ef;
      color: #1d2d3d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 130px;
      max-width: 55%;
      margin-bottom: 25px;
    }

    .check {
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dce9e3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #3e7465;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      color: #1d2d3d;
    }

    .message {
      margin: 0 auto 28px;
      max-width: 400px;
      color: #667477;
      font-size: 16px;
      line-height: 1.6;
    }

    .home-button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 11px;
      background: #1d2d3d;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    .home-button:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="iEcopure_logo.png"
      alt="Innovative Ecopure Technologies"
      class="logo"
    >

    <div class="check">
      ✓
    </div>

    <h1>Thank you!</h1>

    <p class="message">
      Your enquiry has been successfully submitted.
      Our team will get in touch with you shortly.
    </p>

    <a
      href="index.html"
      class="home-button"
    >
      Back to Home
    </a>

  </div>

</body>
</html>
